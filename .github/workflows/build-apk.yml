name: Build Techflow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Verify Python
        run: |
          python --version
          python3 --version
          which python
          which python3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

      - name: Verify Buildozer environment
        run: |
          python --version
          python -c "import sys; print(sys.executable); print(sys.version)"

      - name: Build Techflow APK
        env:
          P4A_PYTHON3: /opt/hostedtoolcache/Python/3.11.9/x64/bin/python3
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          ls -lh bin/
          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: Upload Techflow APK
        uses: actions/upload-artifact@v4
        with:
          name: Techflow-APK
          path: bin/*.apk
          if-no-files-found: error
          
