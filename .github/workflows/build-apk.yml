name: Build Techflow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Project files:"
          find . -maxdepth 2 -type f -print

      - name: Check Buildozer spec
        run: |
          test -f buildozer.spec
          echo "buildozer.spec found successfully!"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Build Techflow APK
        run: |
          buildozer android debug

      - name: Upload Techflow APK
        uses: actions/upload-artifact@v4
        with:
          name: Techflow-APK
          path: bin/*.apk
          if-no-files-found: error
