name: Build Techflow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Check Python
        run: |
          python --version
          python3 --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<76"
          python -m pip install "wheel<1.0"
          python -m pip install "cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Files:"
          ls -la
          echo ""
          echo "Checking required files:"
          test -f main.py
          test -f buildozer.spec
          echo "main.py FOUND"
          echo "buildozer.spec FOUND"

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Techflow APK
        run: |
          buildozer android debug

      - name: Show APK
        if: success()
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Techflow-APK
          path: bin/*.apk