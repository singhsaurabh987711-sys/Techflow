name: Build Techflow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Verify Python
        run: |
          python --version
          python3 --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install "cython<3"
          python -m pip install buildozer

      - name: Verify Buildozer environment
        run: |
          python --version
          buildozer --version
          cython --version

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Techflow APK
        shell: bash
        run: |
          set +e
          buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          echo ""
          echo "========== IMPORTANT ERRORS =========="
          grep -inE "error:|ERROR|failed|FAILED|fatal|Exception|Traceback" build.log | tail -100 || true

          exit $BUILD_EXIT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techflow-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Check APK
        if: success()
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print