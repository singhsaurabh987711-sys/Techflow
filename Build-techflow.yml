name: Build Techflow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Verify Python
        run: |
          python --version
          python3 --version
          which python
          which python3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<76" "wheel<1.0"
          python -m pip install "cython==0.29.36"
          python -m pip install "buildozer==1.5.0"

      - name: Install compatible python-for-android
        run: |
          python -m pip install "python-for-android==2024.1.21"

      - name: Verify build environment
        run: |
          echo "========== PYTHON =========="
          python --version
          python3 --version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== CYTHON =========="
          cython --version

          echo "========== P4A =========="
          python -m pythonforandroid.toolchain --help | head -20

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Techflow APK
        shell: bash
        run: |
          set +e

          buildozer android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          echo ""
          echo "========== IMPORTANT ERRORS =========="
          grep -inE "error:|ERROR|failed|FAILED|fatal|Exception|Traceback|Build failed" build.log | tail -150 || true

          exit $BUILD_EXIT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techflow-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Check APK
        if: success()
        run: |
          echo "========== APK FILES =========="
          find bin -type f -name "*.apk" -print